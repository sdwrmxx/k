        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #000;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            width: 200vh;
            height: 200vh;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            left: 0;
            top: 0;
            background: radial-gradient(
                circle,
                rgba(3, 173, 252, 0.4),
                transparent 70%
            );
            transform: translate(-50%, -50%);
        }

        body::after {
            right: 0;
            bottom: 0;
            background: radial-gradient(
                circle,
                rgba(252, 3, 132, 0.4),
                transparent 70%
            );
            transform: translate(50%,  50%);
        }


        .title {
            margin: 0 auto;
            margin-top: 50px;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /*
        .title-content {
            display: inline-flex;
            align-items: center;
        }
        */

        #title-main {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 120px;
            font-weight: bold;
            white-space: nowrap;
            color: rgba(224, 245, 255 , 1);
            /* background-color: red; */
        }

        #title-link {
            position: absolute;
            right: 4px;
            top: 14px;
            font-size: 23px;
            color: rgba(224, 245, 255, 1);
            text-decoration: none;
        }

        .menu {
            position: absolute;
            z-index: 2;
            width: min(1000px, 90%);
            margin: 0px auto 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .card {
            padding: 25px;
            min-height: 120px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: rgba(224, 245, 255, 1);
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .card h2 {
            margin: 0 0 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
        }

        .card p {
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: rgba(224, 245, 255, 0.65);
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(224, 245, 255, 0.3);
        }
    </style>

<body>
    <div class="title">

            <a href="#" id="title-link">https://sdwrmxx.github.io/k</a>

    </div>
    <div class="menu">

        <div class="card">
            <h2>About</h2>
            <p>Information about me and this website.</p>
        </div>

        <div class="card">
            <h2>Projects</h2>
            <p>My projects, experiments and other stuff.</p>
        </div>

        <div class="card">
            <h2>GitHub</h2>
            <p>My code and open-source projects.</p>
        </div>

        <div class="card">
            <h2>Contact</h2>
            <p>Ways to get in touch with me.</p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
